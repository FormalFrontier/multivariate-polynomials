version: "v0.4"

project:
  name: Multivariate Polynomials
  description: >-
    Reusable multivariate-polynomial results on infinite-variable ideals,
    homogeneous evaluation, disjoint-block substitution and its iteration,
    degree, coefficient extraction and linear evaluation, chosen linear
    division, and existential monic lifts. See README.md and docs/API.md
    for precise hypotheses and limitations.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "A non-finitely-generated variable ideal: finite-support proof exposition"
    authors:
      - Formal Frontier Agents
    type: original-proof
    relationship: adapts
    note: >-
      Project-authored finite-support argument; the independent library proof
      concerns only the variable ideal, not the full motivating exact sequence.
      A proof outline appears in README.md.
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, Exercise 6.7.E, PDF page 199"
    relationship: background
    note: >-
      Motivation for the variable-ideal result, not a claim that the entire
      exercise or its short exact sequence has been formalized here.
  - title: "Structural block substitution and the two iteration orders"
    authors:
      - Beacon
    type: original-proof
    relationship: adapts
    note: >-
      Project-authored mathematical exposition motivating the separate
      structural laws; see docs/block-substitution-laws.md. The Lean laws
      were developed separately, not copied from the exposition.
  - title: "Exact total degree of substitution into disjoint blocks"
    authors:
      - Formal Frontier Agents
    type: original-proof
    relationship: adapts
    note: >-
      Project-authored finite-support argument supporting the no-zero-divisors
      degree result; see docs/block-substitution-degree.md.
  - title: "Polynomial-parameter coefficients of homogeneous multivariate polynomials"
    authors:
      - Formal Frontier Agents
    type: original-proof
    relationship: background
    note: >-
      Project-authored mathematical interpretation; the library theorem
      preserves a homogeneous label, not equality of actual degrees.
  - title: "Polynomial equations in finite-basis coordinates"
    authors:
      - Beacon
    type: original-proof
    relationship: background
    note: >-
      Project-authored background exposition, not a Lean dependency or proof
      of full coordinate reconstruction or source-specific descent.

status:
  scope: >-
    Thirty-nine selected public declarations over the eleven producer modules:
    non-finite generation of the variable ideal for Nontrivial CommSemiring
    coefficients and Infinite variables; scaling under arbitrary CommSemiring
    with fixed coefficient homomorphism; disjoint-block substitution with
    distinct forward-only and iff vanishing; structural renaming, association,
    units and iteration over CommSemiring; conditional attained iteration
    degree powers (not all large degrees); arbitrary-input exact degree under
    NoZeroDivisors; polynomial-parameter coefficient extraction preserving
    homogeneous labels; linear coefficient maps commuting with evaluation at
    base-valued points; chosen linear division over CommRing with unit leading
    coefficients, cone avoidance and preservation of all coefficient ideals;
    and existential monic lifts under surjective coefficient maps for arbitrary
    variables and CommRings, including the zero target. Division also exposes
    six public helpers beyond the selected results. No canonical division,
    Groebner assertion, general base-form construction, multiplicative linear
    functional, or source-specific completion is claimed. See README.md and
    docs/API.md for the detailed module map and guides.
