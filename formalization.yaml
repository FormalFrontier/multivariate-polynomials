automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean, Lake and mathlib for proof
        development, examples and documentation, with independent review.
  notes: >-
    Mathlib's polynomial, ideal and finitely supported-function APIs support
    the degree, coefficient, substitution and division results. Their statements
    specify the relevant coefficient and order hypotheses.

review:
  status: "Review evidence is revision-specific"
  notes: >-
    Independent review, builds and axiom audits apply only to the declarations
    and exact source revisions they cover. This metadata does not certify a
    successful build or complete standard-axiom audit for every selected result,
    nor does it establish source-specific correspondence.
