version: "v0.4"

project:
  name: Multivariate Polynomials
  description: >-
    Non-finite generation of the ideal of all variables over a nontrivial
    commutative semiring with infinitely many variables, and weighted and
    ordinary homogeneous multivariate-polynomial evaluation scaling laws
    over arbitrary commutative semirings, and structural substitution into
    disjoint variable blocks, with generic nested evaluation, distinct
    one-way and equivalent zero-locus conditions, and conditional nonzeroness.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "A non-finitely-generated variable ideal: finite-support proof exposition"
    authors:
      - Formal Frontier Agents
    id: "FormalFrontier/source-vakil-foag@8051ce71598ae2a4822807b5af51e7c543a4b518:expositions/exercise-6-7-e-non-finitely-generated-ideal.md"
    type: original-proof
    relationship: adapts
    note: >-
      Reviewed project-authored mathematical plan for the stronger semiring and
      infinite-variable statement; the Lean proof expression was authored
      separately in multivariate-polynomials commit a96209d0f59d5b8e7f3d3833318aff4ca77edad7.
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, Exercise 6.7.E, PDF page 199"
    relationship: background
    note: >-
      Motivates a short-exact-sequence example; this formalization proves only
      the general non-finite-generation lemma, not the whole sequence statement.

status:
  scope: >-
    Eight selected public declarations: idealOfVars_not_fg under CommSemiring,
    Nontrivial and Infinite assumptions; eval₂Hom_scaleVariables for weighted
    homogeneous polynomials and eval₂Hom_mul_left for ordinary homogeneous
    polynomials over arbitrary commutative semirings, with the coefficient
    homomorphism fixed; plus blockSubst, its evaluation law, separate one-way
    and iff zero-locus preservation, and nonzero-of-one-way under Nontrivial and
    Nonempty. Indices in the first four block declarations are arbitrary and
    coefficients need only CommSemiring. The six default-target clients exercise
    generic, unequal-universe and README ideal use, homogeneous evaluation,
    and two-block, two-stage, finite-field, empty-index, zero-ring and
    constant-block boundary cases. No finite-extension existence, unbounded
    iteration, short exact sequence, norm-forms dependency or source-coverage
    completion claim.
  main_results:
    - declaration: MvPolynomial.idealOfVars_not_fg
      file: MultivariatePolynomials/IdealOfVars.lean
    - declaration: MvPolynomial.IsWeightedHomogeneous.eval₂Hom_scaleVariables
      file: MultivariatePolynomials/HomogeneousEvaluation.lean
    - declaration: MvPolynomial.IsHomogeneous.eval₂Hom_mul_left
      file: MultivariatePolynomials/HomogeneousEvaluation.lean
    - declaration: MvPolynomial.blockSubst
      file: MultivariatePolynomials/BlockSubstitution.lean
    - declaration: MvPolynomial.eval_blockSubst
      file: MultivariatePolynomials/BlockSubstitution.lean
    - declaration: MvPolynomial.eval_blockSubst_eq_zero_imp
      file: MultivariatePolynomials/BlockSubstitution.lean
    - declaration: MvPolynomial.eval_blockSubst_eq_zero_iff
      file: MultivariatePolynomials/BlockSubstitution.lean
    - declaration: MvPolynomial.ne_zero_of_eval_eq_zero_imp
      file: MultivariatePolynomials/BlockSubstitution.lean

