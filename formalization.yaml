version: "v0.4"

project:
  name: Multivariate Polynomials
  description: >-
    Non-finite generation of the ideal of all variables over a nontrivial
    commutative semiring with infinitely many variables, and weighted and
    ordinary homogeneous multivariate-polynomial evaluation scaling laws
    over arbitrary commutative semirings, and structural substitution into
    disjoint variable blocks, with generic nested evaluation, distinct
    one-way and equivalent zero-locus conditions, and conditional nonzeroness.
    Finite disjoint-block iteration has structural tuple recursion, separate
    forward and iff vanishing laws, nominal homogeneous degree powers and
    conditional exact and unbounded attained degrees. Structural laws add
    arbitrary renaming, forward association, singleton units and finite-word
    iteration addition and opposite successor over commutative semirings.
    Exact total degree of substitution into disjoint variable blocks holds
    for arbitrary inputs under CommSemiring and NoZeroDivisors coefficients.
    Native polynomial-parameter interchange preserves a homogeneous multivariate
    label in each coefficient over arbitrary commutative semirings.
    Arbitrary coefficient-linear functionals commute with multivariate-polynomial
    evaluation at base-valued points via the native additive coefficient map.
    Fixed choice-dependent R-linear quotient and reduced-remainder operators
    for arbitrary polynomial divisor families with unit leading coefficients
    over a commutative ring preserve every coefficient ideal.
    Monic multivariate polynomials lift along surjective coefficient maps
    with literal leading-exponent equality over arbitrary commutative rings.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

