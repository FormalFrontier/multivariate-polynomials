version: "v0.4"

project:
  name: Multivariate Polynomials
  description: >-
    Non-finite generation of the ideal of all variables over a nontrivial
    commutative semiring with infinitely many variables, and weighted and
    ordinary homogeneous multivariate-polynomial evaluation scaling laws
    over arbitrary commutative semirings.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "A non-finitely-generated variable ideal: finite-support proof exposition"
    authors:
      - Formal Frontier Agents
    id: "FormalFrontier/source-vakil-foag@8051ce71598ae2a4822807b5af51e7c543a4b518:expositions/exercise-6-7-e-non-finitely-generated-ideal.md"
    type: original-proof
    relationship: adapts
    note: >-
      Reviewed project-authored mathematical plan for the stronger semiring and
      infinite-variable statement; the Lean proof expression was authored
      separately in multivariate-polynomials commit a96209d0f59d5b8e7f3d3833318aff4ca77edad7.
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, Exercise 6.7.E, PDF page 199"
    relationship: background
    note: >-
      Motivates a short-exact-sequence example; this formalization proves only
      the general non-finite-generation lemma, not the whole sequence statement.

status:
  scope: >-
    Three public theorems: idealOfVars_not_fg under CommSemiring, Nontrivial
    and Infinite assumptions; eval₂Hom_scaleVariables for weighted homogeneous
    polynomials over arbitrary commutative coefficient/target semirings; and
    eval₂Hom_mul_left for ordinary homogeneous polynomials with the same
    generality. The coefficient homomorphism remains fixed. Generic, concrete,
    unequal-universe and exact README ideal clients and three direct-import
    homogeneous-evaluation examples are registered under the default test
    target. No short-exact-sequence API or source-coverage completion claim.
  main_results:
    - declaration: MvPolynomial.idealOfVars_not_fg
      file: MultivariatePolynomials/IdealOfVars.lean
    - declaration: MvPolynomial.IsWeightedHomogeneous.eval₂Hom_scaleVariables
      file: MultivariatePolynomials/HomogeneousEvaluation.lean
    - declaration: MvPolynomial.IsHomogeneous.eval₂Hom_mul_left
      file: MultivariatePolynomials/HomogeneousEvaluation.lean

automation:
  methods:
