version: "v0.4"

project:
  name: Multivariate Polynomials
  description: >-
    Non-finite generation of the ideal of all variables over a nontrivial
    commutative semiring with infinitely many variables, and weighted and
    ordinary homogeneous multivariate-polynomial evaluation scaling laws
    over arbitrary commutative semirings, and structural substitution into
    disjoint variable blocks, with generic nested evaluation, distinct
    one-way and equivalent zero-locus conditions, and conditional nonzeroness.
    Finite disjoint-block iteration has structural tuple recursion, separate
    forward and iff vanishing laws, nominal homogeneous degree powers and
    conditional exact and unbounded attained degrees. Structural laws add
    arbitrary renaming, forward association, singleton units and finite-word
    iteration addition and opposite successor over commutative semirings.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "A non-finitely-generated variable ideal: finite-support proof exposition"
    authors:
      - Formal Frontier Agents
    id: "FormalFrontier/source-vakil-foag@8051ce71598ae2a4822807b5af51e7c543a4b518:expositions/exercise-6-7-e-non-finitely-generated-ideal.md"
    type: original-proof
    relationship: adapts
    note: >-
      Reviewed project-authored mathematical plan for the stronger semiring and
      infinite-variable statement; the Lean proof expression was authored
      separately in multivariate-polynomials commit a96209d0f59d5b8e7f3d3833318aff4ca77edad7.
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, Exercise 6.7.E, PDF page 199"
    relationship: background
    note: >-
      Motivates a short-exact-sequence example; this formalization proves only
      the general non-finite-generation lemma, not the whole sequence statement.
  - title: "Structural block substitution and the two iteration orders"
    authors:
      - Beacon
    id: "FormalFrontier/source-nsw@f48d95396b6395f5248afdac7892379362eb50f5:expositions/block-substitution-associativity-and-iteration.md"
    type: original-proof
    relationship: adapts
    note: >-
      Project-authored structural mathematical argument, independently
      reviewed in source-nsw at 1c5de16e1f81e9d2ce9f9bc534d03dcd4780f5c1;
      the independent original Lean laws/client author is the worker-b Task
      named below. Neither exposition nor abstract API certifies source
      numbering, normicity or source coverage.

status:
  scope: >-
    Twenty-six selected public declarations: idealOfVars_not_fg under CommSemiring,
    Nontrivial and Infinite assumptions; eval₂Hom_scaleVariables for weighted
    homogeneous polynomials and eval₂Hom_mul_left for ordinary homogeneous
    polynomials over arbitrary commutative semirings, with the coefficient
    homomorphism fixed; plus blockSubst, its evaluation law, separate one-way
    and iff zero-locus preservation, and nonzero-of-one-way under Nontrivial and
    Nonempty. Indices in the first four block declarations are arbitrary and
    coefficients need only CommSemiring. The separate iterator has one definition
    and ten theorems over tuple indices Fin r → ι: zero/successor recursion and
    evaluations, separate forward-only/iff vanishing, nominal homogeneity d^r,
    nonzero and exact total degree under Nontrivial, Nonempty and forward
    vanishing, and degrees attained above each bound when 1 < d. The seven
    new structural laws cover arbitrary (including noninjective) variable
    renamings, forward three-block association, single-variable PUnit units,
    one iteration, additive iteration by Fin.append and opposite succession
    by Fin.snoc under arbitrary CommSemiring, without extra hypotheses. Eight
    default-target clients exercise
    generic, unequal-universe and README ideal use, homogeneous evaluation,
    and two-block, two-stage, finite-field, empty-index, zero-ring,
    constant-block, zero-iteration, mixed/empty-index, noninjective-map and
    zero-ring structural-law boundary cases. No base-form or
    finite-extension existence, all-sufficiently-large degree, short exact
    sequence, norm-forms dependency or source-coverage completion claim.
