automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean, Lake and mathlib for proof
        development, examples and documentation, with independent review.
  notes: >-
    Some original Lean proofs and clients were first developed in the shared
    incubator and transferred mechanically into this deliverable; transfer
    is not independent mathematical authorship. Detailed working provenance
    and review evidence are held in the project's owning records. The shipped
    mathematics, dependencies and selected results are documented here.

review:
  status: "Lean results independently reviewed"
  notes: >-
    The Lean graph has successful builds and a transitive standard-axiom audit,
    including private declarations. Documentation, metadata, attribution review
    and CI evidence apply to exact revisions and are recorded in the repository's
    corresponding pull requests. This metadata does not itself certify source
    correspondence or completion.
