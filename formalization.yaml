status:
  scope: >-
    Thirty-nine selected public declarations: idealOfVars_not_fg under CommSemiring,
    Nontrivial and Infinite assumptions; eval₂Hom_scaleVariables for weighted
    homogeneous polynomials and eval₂Hom_mul_left for ordinary homogeneous
    polynomials over arbitrary commutative semirings, with the coefficient
    homomorphism fixed; plus blockSubst, its evaluation law, separate one-way
    and iff zero-locus preservation, and nonzero-of-one-way under Nontrivial and
    Nonempty. Indices in the first four block declarations are arbitrary and
    coefficients need only CommSemiring. The separate iterator has one definition
    and ten theorems over tuple indices Fin r → ι: zero/successor recursion and
    evaluations, separate forward-only/iff vanishing, nominal homogeneity d^r,
    nonzero and exact total degree under Nontrivial, Nonempty and forward
    vanishing, and degrees attained above each bound when 1 < d. The seven
    new structural laws cover arbitrary (including noninjective) variable
    renamings, forward three-block association, single-variable PUnit units,
    one iteration, additive iteration by Fin.append and opposite succession
    by Fin.snoc under arbitrary CommSemiring, without extra hypotheses. One
    additional exact total-degree theorem for disjoint-block substitution
    holds under CommSemiring and NoZeroDivisors alone for arbitrary zero,
    constant and nonhomogeneous polynomials and arbitrary index types; it
    asserts no general substitution injectivity. The polynomial-coefficient
    interchange theorem retains the original homogeneous multivariate label
    after extracting any polynomial-parameter coefficient under CommSemiring,
    without a domain, field, finiteness or nontriviality premise. T has weight
    zero and zero coefficients retain any label; no actual-degree equality,
    multiplicative coefficient map, nonzero recovery or finite-basis descent
    is claimed. The independent linear-coefficient-evaluation theorem
    commutes an arbitrary R-linear S-to-R coefficient functional with
    evaluation at points valued in R using native AddMonoidAlgebra.map, without
    multiplicativity, finite bases/variables, injectivity, field, domain or
    nontriviality assumptions. It gives no full coordinate reconstruction,
    homogeneity, descent, common-zero or source theorem. The nine selected
    fixed-linear-division results for arbitrary variables, divisor families
    and CommRing coefficients require unit leading coefficients: chosen
    R-linear quotient/remainder maps reconstruct every input, avoid all
    leading cones in the remainder's actual componentwise exponent support,
    preserve every coefficient ideal (also in each quotient coordinate),
    and fix reduced inputs with zero quotient. The general R-linear-map
    coefficient-ideal lemma has no division hypothesis. Six further producer
    helpers remain public, but not selected results. No canonical or unique
    division maps, Gröbner, field, domain, finite-variable/family or
    restricted-series claim is made. The additional monic-lift theorem for
    arbitrary variables and commutative rings needs a surjective coefficient
    homomorphism and monic target, not injectivity, a field, a domain or blanket
    nontriviality; it preserves the literal leading exponent even for a zero
    target. The lift is existential, not canonical. Thirteen default-target
    clients exercise
    generic, unequal-universe and README ideal use, homogeneous evaluation,
    and two-block, two-stage, finite-field, empty-index, zero-ring,
    constant-block, zero-iteration, mixed/empty-index, noninjective-map and
    zero-ring structural-law boundary cases, plus exact-degree zero,
    constant, unequal/empty-index, finite-field and trivial-ring cases,
    plus polynomial-parameter substitution, zero, degree zero, bound zero,
    ZMod 1 and ZMod 6, plus basis coordinates, a genuinely nonmultiplicative
    Nat-pair sum, zero-map and Empty linear-evaluation cases, plus generic,
    finite/empty-family, zero-input/zero-ring, reduced-input and nonzero
    proper ZMod 4 ideal linear-division clients, plus generic, noninjective
    quotient, empty-variable and zero target/source monic-lift clients. No base-form
    or finite-extension existence, all-sufficiently-large degree, short exact
    sequence, norm-forms dependency or source-coverage completion claim.
