name = "multivariate-polynomials"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["MultivariatePolynomials", "MultivariatePolynomialsTests", "MultivariatePolynomialsIdealTests", "MultivariatePolynomialsAlgebraTests"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "coherent-modules"
git = "https://github.com/FormalFrontier/coherent-modules.git"
rev = "408a52bd54df17ccc928ce970942f1313ff10d5c"

[[require]]
name = "algebraic-direct-limits"
git = "https://github.com/FormalFrontier/algebraic-direct-limits.git"
rev = "5959888b3d648cf1f72038459f63d804093d6c54"

[[lean_lib]]
name = "MultivariatePolynomials"

[[lean_lib]]
name = "MultivariatePolynomialsTests"
leanOptions = { weak.linter.privateModule = false }
roots = ["MultivariatePolynomialsTests.Taylor", "MultivariatePolynomialsTests.AddUnits", "MultivariatePolynomialsTests.IdealOfVars", "MultivariatePolynomialsTests.Axioms", "MultivariatePolynomialsTests.LeafImport", "MultivariatePolynomialsTests.ReadmeExample",
  "MultivariatePolynomialsTests.UnitSufficiency", "MultivariatePolynomialsTests.BlockSubstitutionLaws", "MultivariatePolynomialsTests.BlockSubstitutionDegree", "MultivariatePolynomialsTests.LinearCoefficientEvaluation", "MultivariatePolynomialsTests.FirstVariableLex", "MultivariatePolynomialsTests.QuotientClosedPoints", "MultivariatePolynomialsTests.ZariskiTopology", "MultivariatePolynomialsTests.LocalizedCoordinateQuotient", "MultivariatePolynomialsTests.PolynomialFractionTrace", "MultivariatePolynomialsTests.FiniteSupportModels", "MultivariatePolynomialsTests.FiniteSupportProfile", "MultivariatePolynomialsTests.RenameKernel", "MultivariatePolynomialsTests.RenameKernelCriterion", "MultivariatePolynomialsTests.RenameKernelProperties", "MultivariatePolynomialsTests.RenameFinitePresentationSemiring", "MultivariatePolynomialsTests.RenameFinitePresentationModels", "MultivariatePolynomialsTests.RenameNegative", "MultivariatePolynomialsTypeTests.RenameFlatness", "MultivariatePolynomialsTests.RenameFlatnessModels", "MultivariatePolynomialsTests.RenameBasis", "MultivariatePolynomialsTests.InfiniteIntegrallyClosed", "MultivariatePolynomialsTests.Jacobson", "MultivariatePolynomialsTests.MonomialIdealGenerators",
  "MultivariatePolynomialsTests.ResultantCongruence"]

[[lean_lib]]
name = "MultivariatePolynomialsIdealTests"
roots = ["MultivariatePolynomialsTests.CoefficientIdeal", "MultivariatePolynomialsTests.EvaluationIdealTwoPoints", "MultivariatePolynomialsTests.CoefficientIdealSubtractive", "MultivariatePolynomialsTests.IdealOfVarsSubset", "MultivariatePolynomialsTests.EvaluationIdealImage", "MultivariatePolynomialsTests.Nilpotent", "MultivariatePolynomialsTests.MonomialIdeal", "MultivariatePolynomialsTests.CoefficientVariableIdeal", "MultivariatePolynomialsTests.EvaluationIdeal", "MultivariatePolynomialsTests.EvaluationIdealNaturality", "MultivariatePolynomialsTests.Primary", "MultivariatePolynomialsTests.PrimaryDecomposition"]

[lean_lib.leanOptions]
weak.linter.privateModule = false

[[lean_lib]]
name = "MultivariatePolynomialsAlgebraTests"
roots = ["MultivariatePolynomialsTests.RenamePositive", "MultivariatePolynomialsTests.RenameCriterion", "MultivariatePolynomialsTests.Artinian", "MultivariatePolynomialsTests.ArtinianCriterion", "MultivariatePolynomialsTests.PolynomialArtinianModels", "MultivariatePolynomialsTests.PolynomialMatrixArtinian", "MultivariatePolynomialsTests.PolynomialArtinianClient", "MultivariatePolynomialsTests.HomogeneousEvaluation", "MultivariatePolynomialsTests.BlockSubstitution", "MultivariatePolynomialsTests.IteratedBlockSubstitution", "MultivariatePolynomialsTests.PolynomialCoefficientHomogeneity", "MultivariatePolynomialsTests.LinearDivision", "MultivariatePolynomialsTests.MonicLift", "MultivariatePolynomialsTests.WeightOneValuation", "MultivariatePolynomialsTests.WeightOneNaturality", "MultivariatePolynomialsTests.FractionRingFiniteVariables", "MultivariatePolynomialsTests.FractionRingAlgebraicIndependence", "MultivariatePolynomialsTests.PolynomialAddUnits", "MultivariatePolynomialsTests.PolynomialCoefficientModules", "MultivariatePolynomialsTests.FractionRingTranscendenceBasis", "MultivariatePolynomialsTypeTests.DegreeControlledEvaluation", "MultivariatePolynomialsTypeTests.FractionRingTranscendenceBasis", "MultivariatePolynomialsTests.ScalarAnnihilatorCriterion", "MultivariatePolynomialsTests.FiniteSupport", "MultivariatePolynomialsTests.PointSquareZeroFixtures", "MultivariatePolynomialsTests.PointSquareZeroHeadline", "MultivariatePolynomialsTests.Noetherian", "MultivariatePolynomialsTests.CoefficientProductResultant", "MultivariatePolynomialsTests.ResultantFactorization", "MultivariatePolynomialsTests.NatRadicalModels"]

[lean_lib.leanOptions]
weak.linter.privateModule = false
